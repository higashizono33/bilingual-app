name: CI

# Pull Request時にlint/testを実行する(docs/requirements.md 8.5章)。
# npm workspaces構成(packages/analysis, app, infra)のため、ルートで一括インストールしてから
# 各ワークスペースのスクリプトを順番に実行する。
# infra(CDK)はpackages/analysisのビルド成果物(dist/)をLambdaコードから参照するため、
# 先にanalysisをビルドしてからinfraのbuild/test/synthを実行する順序に注意。

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: lint / test / build / cdk synth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (workspace root)
        run: npm ci

      - name: Build @bilingual-app/analysis
        run: npm run build:analysis

      - name: Test @bilingual-app/analysis (語彙分析ロジックのユニットテスト)
        run: npm run test:analysis

      - name: Lint app
        run: npm run lint:app

      - name: Test app
        run: npm run test:app

      - name: Build app (React + Vite)
        run: npm run build:app

      - name: Build infra (CDKスタック定義の型チェック)
        run: npm run build:infra

      - name: Test infra (CDKスタックのユニットテスト)
        run: npm run test:infra

      - name: cdk synth (Lambdaバンドル込みでCloudFormationテンプレートを検証)
        run: npm run synth:infra
