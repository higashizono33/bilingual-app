name: Deploy

# mainブランチへのマージをトリガーに本番環境へ自動デプロイする(docs/requirements.md 8.5章)。
#
# AWSへの認証は長期アクセスキーをSecretsに置かず、GitHub OIDCで
# IAMロールを一時的にAssumeする方式を使う。実際に有効化する際は:
#   1. Takashiさん自身のAWS管理者権限で、GitHub OIDC IDプロバイダとデプロイ用IAMロールを作成する
#      (infra/lib/github-oidc-stack.ts。GitHub Actions自身には作らせられないため手動デプロイ専用)
#        cd infra && npx cdk deploy GitHubOidcStack -c githubRepo=higashizono33/bilingual-app
#      出力される DeployRoleArn を控える
#   2. リポジトリの Settings > Secrets and variables > Actions に
#      AWS_DEPLOY_ROLE_ARN (手順1のDeployRoleArn) を登録
#      (任意) BUDGET_ALERT_EMAIL を登録すると、AWS BudgetsのアラートをEmail購読する
#   3. (完了) Secrets設定後、有効化済み
#   4. 初回のみ、Takashiさん自身の権限で `cdk bootstrap` と
#      `cdk deploy BilingualAppStackの更新デプロイのみを行う。GitHubOidcStackのトラストポリシーが従来形式(IDなし)のままだと
# "Not authorized to perform sts:AssumeRoleWithWebIdentity" で失敗する。
# infra/lib/github-oidc-stack.ts の githubRepoOwnerId/githubRepoId で対応済み
# (infra/README.md 参照)。トラストポリシーを変更した場合は必ず
# `cdk deploy GitHubOidcStack` を手動で再実行してAWS側に反映すること。

on:
  push:
    branches: [main]

permissions:
  id-token: write # OIDCでAWS認証するために必要
  contents: read

jobs:
  deploy:
    name: Deploy infra + app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (workspace root)
        run: npm ci

      - name: Build @bilingual-app/analysis (Lambdaコードから参照される共有ロジック)
        run: npm run build:analysis

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2 # 必要に応じて変更
          # aws-actions/configure-aws-credentials はデフォルトでGitHubコンテキストを
          # セッションタグとして付与しようとするが、GitHubOidcStackのトラストポリシーは
          # sts:AssumeRoleWithWebIdentity のみ許可(sts:TagSessionは許可していない)ため、
          # タグ付けをスキップする。付与しない場合エラーは紛らわしく
          # "Not authorized to perform sts:AssumeRoleWithWebIdentity" として出る。
          role-skip-session-tagging: true

      - name: Deploy CDK stack (infra/BilingualAppStackのみ。GitHubOidcStackは対象外)
        working-directory: infra
        env:
          BUDGET_ALERT_EMAIL: ${{ secrets.BUDGET_ALERT_EMAIL }}
        run: |
          CONTEXT_ARGS=""
          if [ -n "$BUDGET_ALERT_EMAIL" ]; then
            CONTEXT_ARGS="-c budgetAlertEmail=$BUDGET_ALERT_EMAIL"
          fi
          npx cdk deploy BilingualAppStack --require-approval never $CONTEXT_ARGS

      - name: Resolve dashboard bucket name and app config from stack outputs
        id: stack-outputs
        run: |
          OUTPUTS=$(aws cloudformation describe-stacks --stack-name BilingualAppStack --query "Stacks[0].Outputs" --output json)
          echo "bucket=$(echo "$OUTPUTS" | jq -r '.[] | select(.OutputKey=="DashboardBucketName") | .OutputValue')" >> "$GITHUB_OUTPUT"
          echo "api_url=$(echo "$OUTPUTS" | jq -r '.[] | select(.OutputKey=="ApiUrl") | .OutputValue')" >> "$GITHUB_OUTPUT"
          echo "user_pool_id=$(echo "$OUTPUTS" | jq -r '.[] | select(.OutputKey=="UserPoolId") | .OutputValue')" >> "$GITHUB_OUTPUT"
          echo "user_pool_client_id=$(echo "$OUTPUTS" | jq -r '.[] | select(.OutputKey=="UserPoolClientId") | .OutputValue')" >> "$GITHUB_OUTPUT"

      - name: Build dashboard (app/)
        working-directory: app
        env:
          VITE_API_BASE_URL: ${{ steps.stack-outputs.outputs.api_url }}
          VITE_COGNITO_USER_POOL_ID: ${{ steps.stack-outputs.outputs.user_pool_id }}
          VITE_COGNITO_USER_POOL_CLIENT_ID: ${{ steps.stack-outputs.outputs.user_pool_client_id }}
        run: npm run build

      - name: Sync dashboard static files to S3 (app/)
        run: aws s3 sync app/dist "s3://${{ steps.stack-outputs.outputs.bucket }}/" --delete
