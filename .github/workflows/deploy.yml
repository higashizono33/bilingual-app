name: Deploy

# main ブランチへのマージをトリガーに本番環境へ自動デプロイする
# (docs/requirements.md 8.5章)。
#
# AWSへの認証は長期アクセスキーをSecretsに置かず、GitHub OIDCで
# IAMロールを一時的にAssumeする方式を使う。実際に有効化する際は:
#   1. AWS側でGitHub OIDC IDプロバイダとデプロイ用IAMロールを作成
#   2. リポジトリの Settings > Secrets and variables > Actions に
#      AWS_DEPLOY_ROLE_ARN (IAMロールARN) を登録
#   3. 下記 `if: false` を外し、AWS_DEPLOY_ROLE_ARN 未設定時にジョブが
#      失敗しないことを確認してから有効化する

on:
  push:
    branches: [main]

permissions:
  id-token: write   # OIDCでAWS認証するために必要
  contents: read

jobs:
  deploy:
    name: Deploy infra + app
    runs-on: ubuntu-latest
    # infra/ 実装 & AWS_DEPLOY_ROLE_ARN Secret 設定が完了するまでは無効化しておく
    if: false
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1 # 必要に応じて変更

      - name: Deploy CDK stacks (infra/)
        run: |
          cd infra
          npm ci
          npx cdk deploy --all --require-approval never

      - name: Sync dashboard static files to S3 (app/)
        run: |
          echo "TODO: aws s3 sync app/dist s3://<dashboard-bucket>/ --delete"
